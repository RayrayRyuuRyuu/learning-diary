<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d7a70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="래니래니의 학습·성장 다이어리 — 영역별 학습 기록, 사진, 시간 분석">
<title>래니래니 (초2) 학습·성장 다이어리</title>
<style>
:root{
  color-scheme:only light;
  --bg:#fbf8f3;
  --bg-2:#f5f0e7;
  --card:#fffdfa;
  --ink:#22322f;
  --ink-2:#54655f;
  --muted:#8d9a94;
  --line:#ece5d9;
  --line-2:#f4efe6;
  --teal:#0f766e;
  --teal-2:#0d9488;
  --teal-3:#0b5f59;
  --teal-soft:#e6f5f1;
  --teal-soft-2:#d3ece6;
  --amber:#c98a1c;
  --amber-soft:#fdf2d8;
  --sun:#fdf1b6;
  --sun-2:#fbe58c;
  --rose:#d9698a;
  --shadow-sm:0 1px 2px rgba(34,50,47,.04), 0 4px 12px -8px rgba(34,50,47,.18);
  --shadow:0 1px 2px rgba(34,50,47,.05), 0 10px 26px -16px rgba(34,50,47,.30);
  --r:18px;
  --r-sm:13px;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 8% -8%, #e8f5f0 0%, rgba(232,245,240,0) 62%),
    radial-gradient(820px 460px at 108% 4%, #fdf2d9 0%, rgba(253,242,217,0) 58%),
    var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Segoe UI",Roboto,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  min-height:100vh;
  overscroll-behavior-y:contain;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-appearance:none;appearance:none;touch-action:manipulation}
input,select,textarea{-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{width:100%;max-width:520px;margin:0 auto;position:relative}

/* ── Header ─────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(150deg,#0c6f68 0%,#0e8478 52%,#11a091 100%);
  color:#fff;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;
  border-radius:0 0 24px 24px;
  box-shadow:0 12px 28px -20px rgba(11,95,89,.95);
  overflow:hidden;
}
.topbar::after{
  content:"";position:absolute;inset:-60% -30% auto auto;width:220px;height:220px;
  background:radial-gradient(circle at center, rgba(255,255,255,.16), rgba(255,255,255,0) 68%);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.mascot{
  width:42px;height:42px;flex:0 0 42px;border-radius:14px;
  background:linear-gradient(160deg,#fff6d8,#ffe08a);
  color:#0b5f59;display:grid;place-items:center;
  font-weight:900;font-size:17px;letter-spacing:-.02em;
  box-shadow:0 4px 12px -6px rgba(0,0,0,.45), inset 0 -2px 0 rgba(0,0,0,.05);
}
.brand-text{min-width:0;flex:1}
.kicker{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.72);font-weight:700;
}
.brand h1{
  font-size:18.5px;font-weight:800;letter-spacing:-.02em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand h1 small{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.82);margin-left:2px}
.icon-btn{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  font-size:19px;background:rgba(255,255,255,.14);color:#fff;
  transition:background .15s ease, transform .15s ease;
}
.icon-btn:active{transform:scale(.94);background:rgba(255,255,255,.24)}
.tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:12px 0 0;
  background:rgba(255,255,255,.16);border-radius:14px;padding:4px;
  position:relative;z-index:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.tab{
  height:38px;border-radius:11px;font-weight:800;font-size:14px;
  color:rgba(255,255,255,.86);letter-spacing:-.01em;
  transition:background .16s ease,color .16s ease,box-shadow .16s ease;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.tab.active{background:#fff;color:var(--teal-3);box-shadow:0 3px 10px -4px rgba(0,0,0,.28)}
.tab:not(.active):active{background:rgba(255,255,255,.2)}

/* ── Layout ─────────────────────────────── */
main{padding:12px 13px 8px;display:flex;flex-direction:column;gap:12px}
#view-write,#view-read{display:flex;flex-direction:column;gap:12px}
#sections{display:flex;flex-direction:column;gap:10px}
#readContent{display:flex;flex-direction:column;gap:12px}
#view-write{padding-bottom:88px}
#view-read{padding-bottom:26px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-sm);
}
.section-title{
  display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800;letter-spacing:-.01em;
  padding:2px 2px 0;color:var(--ink);
}
.section-title::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,var(--teal-2),var(--teal))}
.muted{color:var(--muted)}
.tiny{font-size:12px}

/* ── Calendar ───────────────────────────── */
.cal-card{padding:11px 11px 9px;overflow:hidden}
.cal-head{display:flex;align-items:center;gap:2px}
.cal-title{
  flex:1;text-align:center;font-size:15.5px;font-weight:800;letter-spacing:-.02em;
  padding:4px 0;color:var(--ink);
}
.cal-nav{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-2);font-size:16px;line-height:1;
  transition:background .15s ease;
}
.cal-nav:active{background:var(--line-2)}
.cal-toggle{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);
  font-size:15px;transition:transform .2s ease,background .15s ease;
}
.cal-toggle:active{background:var(--line-2)}
.cal-card.collapsed .cal-toggle{transform:rotate(180deg)}
.cal-card.collapsed .cal-body{display:none}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-week{margin:4px 0 2px}
.cal-week span{
  text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:3px 0;
}
.cal-week span:first-child{color:#cf6b62}
.cal-week span:last-child{color:#5b86c4}
.cal-cell{
  position:relative;height:42px;border-radius:12px;display:grid;place-items:center;
  transition:background .14s ease,transform .12s ease;
}
.cal-cell .num{
  width:31px;height:31px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;
  transition:background .14s ease,color .14s ease,box-shadow .14s ease;
}
.cal-cell.sun .num{color:#c9605a}
.cal-cell.sat .num{color:#5b86c4}
.cal-cell.out .num{opacity:.28}
.cal-cell.has .num{background:var(--sun);color:#7a5a12;font-weight:800}
.cal-cell.today .num{box-shadow:inset 0 0 0 2px var(--teal-2)}
.cal-cell.sel .num{background:linear-gradient(160deg,#128a7d,#0b6a63);color:#fff;font-weight:800;box-shadow:0 4px 10px -6px rgba(11,106,99,.9)}
.cal-cell.sel.has .num{background:linear-gradient(160deg,#128a7d,#0b6a63);color:#fff}
.cal-cell:active .num{transform:scale(.9)}
.cal-cell .dot{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--amber);opacity:.9;
}
.cal-cell.sel .dot{background:#fff}
.cal-foot{
  display:flex;align-items:center;gap:12px;padding:7px 3px 1px;margin-top:3px;
  border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);
}
.legend{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.legend .lg-rec{background:var(--sun)}
.legend .lg-today{box-shadow:inset 0 0 0 2px var(--teal-2)}
.mini-btn{
  margin-left:auto;font-size:11.5px;font-weight:800;color:var(--teal);
  background:var(--teal-soft);border-radius:9px;padding:5px 10px;
}
.mini-btn:active{background:var(--teal-soft-2)}

/* ── Tip ────────────────────────────────── */
.tip{
  display:flex;gap:9px;align-items:flex-start;
  background:linear-gradient(140deg,#fff9e8,#fdf1d4);
  border:1px solid #f3e3bd;border-radius:15px;padding:10px 11px;
  font-size:12.5px;line-height:1.5;color:#7a5c1a;
}
.tip .tx{flex:1}
.tip b{color:#6b4d10}
.tip .x{
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:0 0 24px;
  color:#a98a4a;font-size:14px;background:rgba(255,255,255,.6);
}

/* ── Date bar ───────────────────────────── */
.datebar{
  display:flex;align-items:center;gap:6px;padding:7px 8px;
  position:sticky;top:calc(96px + env(safe-area-inset-top,0px));z-index:12;
  background:rgba(255,253,250,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.dnav{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);font-size:17px}
.dnav:active{background:var(--line-2)}
.datebar-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.datebar-mid b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.datebar-mid .wd{color:var(--muted);font-weight:700;font-size:13px}
.badge{
  font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;
  background:var(--amber-soft);color:#8a6413;letter-spacing:-.01em;white-space:nowrap;
}

/* ── Jump bar ───────────────────────────── */
.jumpbar{display:flex;gap:6px;overflow-x:auto;padding:1px 2px 0;margin-bottom:-5px;scrollbar-width:none;-ms-overflow-style:none}
.jumpbar::-webkit-scrollbar{display:none}
.jump{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;
  color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px;
  letter-spacing:-.01em;white-space:nowrap}
.jump.on{background:var(--teal-soft);border-color:var(--teal-soft-2);color:var(--teal-3)}
.jump:active{transform:scale(.96)}
.jump .d{width:5px;height:5px;border-radius:50%;background:var(--amber);flex:0 0 5px}

/* ── Section cards (write) ──────────────── */
.sec{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-sm);overflow:hidden;
  transition:box-shadow .2s ease;
}
.sec.is-filled{border-color:#e2ecdf;box-shadow:0 1px 2px rgba(34,50,47,.04),0 8px 22px -18px rgba(15,118,110,.55)}
.sec-head{
  display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;
  background:linear-gradient(180deg,#f9f6ef,#f4efe5);
  border-bottom:1px solid var(--line-2);
}
.sec-head .gd{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--teal-2)}
.sec-head.other .gd{background:#e0a83c}
.sec-name{
  flex:1;min-width:0;font-weight:800;font-size:14.5px;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sec-name .pre{color:var(--muted);font-weight:700;font-size:12.5px}
.photo-btn{
  display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
  font-size:11.5px;font-weight:800;color:var(--teal);
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 8px;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.photo-btn:active{background:var(--teal-soft)}
.sec-body{padding:0}
.time-row{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-bottom:1px solid var(--line-2);flex-wrap:wrap;
}
.time-in{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.tin{
  width:42px;height:32px;text-align:center;font-weight:800;font-size:14px;
  border:1px solid var(--line);border-radius:9px;background:#fff;
  font-variant-numeric:tabular-nums;padding:0;
}
.tin:focus{border-color:var(--teal-2);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.tin::-webkit-outer-spin-button,.tin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tin{-moz-appearance:textfield;appearance:textfield}
.time-in span{font-size:11.5px;color:var(--muted);font-weight:700}
.chips{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{
  font-size:11.5px;font-weight:800;color:var(--ink-2);background:#f7f4ed;
  border:1px solid var(--line);border-radius:8px;padding:5px 7px;letter-spacing:-.01em;
  transition:background .13s ease,color .13s ease,border-color .13s ease;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.clear{color:var(--muted)}
.sec-text{
  width:100%;display:block;border:0;background:transparent;resize:none;
  padding:11px 13px;font-size:15px;line-height:1.68;min-height:76px;
  color:var(--ink);caret-color:var(--teal-2);
}
.sec-text::placeholder{color:#b9c3bf}
.sec-text:focus{outline:none}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 0}
.photos:not(:empty){padding-bottom:11px;padding-top:2px}
.thumb{
  position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;
  background:var(--line-2);border:1px solid var(--line);
}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .del{
  position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(22,34,32,.68);color:#fff;font-size:12px;line-height:1;
  display:grid;place-items:center;backdrop-filter:blur(2px);
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.add-cat{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;height:48px;border-radius:15px;font-weight:800;font-size:14px;
  color:var(--teal);background:rgba(255,255,255,.7);
  border:1.5px dashed var(--teal-soft-2);
}
.add-cat:active{background:var(--teal-soft)}

/* ── Analysis ───────────────────────────── */
.analysis{padding:12px 11px 10px}
.analysis h3{font-size:14.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.analysis h3::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,var(--teal-2),var(--teal))}
.analysis .sub{font-size:11.5px;color:var(--muted);margin:2px 0 8px;padding-left:11px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:11px;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;background:var(--card)}
.tbl th,.tbl td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl thead th{
  background:#f7f3ea;font-weight:800;color:var(--ink-2);font-size:11.5px;
  position:sticky;top:0;
}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.nm,.tbl th.nm{text-align:left;padding-left:9px;max-width:132px;overflow:hidden;text-overflow:ellipsis}
.tbl .nm .gd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal-2);margin-right:5px;vertical-align:1px}
.tbl .nm .gd.other{background:#e0a83c}
.tbl td.nm{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line-2)}
.tbl thead th.nm{position:sticky;left:0;z-index:3;background:#f7f3ea}
.tbl tr.total td.nm{background:#faf7f0}
.tbl td.dim{color:#c8cec9}
.tbl td.has{font-weight:800;color:var(--teal-3);background:#f2faf7}
.tbl tr.total td{background:#faf7f0;font-weight:800;color:var(--ink)}
.tbl .bar{height:5px;border-radius:3px;background:var(--teal-soft-2);overflow:hidden;min-width:38px}
.tbl .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal-2),var(--teal))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.stat{
  border-radius:13px;padding:9px 8px;text-align:center;
  background:linear-gradient(160deg,#f3faf8,#eaf5f1);border:1px solid #dcefe9;
}
.stat .k{font-size:10.5px;font-weight:800;color:#56847c;letter-spacing:.02em}
.stat .v{font-size:16px;font-weight:900;letter-spacing:-.02em;color:var(--teal-3);margin-top:1px}
.stat:nth-child(3){background:linear-gradient(160deg,#fff7e6,#fdefd2);border-color:#f4e3bf}
.stat:nth-child(3) .k{color:#a07a2a}
.stat:nth-child(3) .v{color:#7a5613}

/* ── Action bar ─────────────────────────── */
.actionbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);
  display:flex;gap:8px;padding:9px 13px calc(9px + var(--safe-b));z-index:26;
  background:linear-gradient(180deg,rgba(251,248,243,.82),rgba(251,248,243,.98) 45%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(236,229,217,.9);
}
.btn{
  height:46px;border-radius:14px;font-weight:800;font-size:14.5px;letter-spacing:-.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .12s ease,filter .15s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{
  flex:1.35;color:#fff;background:linear-gradient(160deg,#12a091,#0b6a62);
  box-shadow:0 8px 18px -10px rgba(11,106,99,.95);
}
.btn.soft{flex:1;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-soft-2)}
.btn.ghost{flex:.85;color:var(--ink-2);background:#fff;border:1px solid var(--line)}
.btn.sm{height:38px;font-size:13px;border-radius:11px}

/* ── Read view ──────────────────────────── */
.read-head{padding:13px 13px 11px;display:flex;flex-direction:column;gap:9px}
.rh-top{display:flex;align-items:flex-start;gap:8px}
.rh-date{flex:1;min-width:0}
.rh-date .d1{font-size:16.5px;font-weight:900;letter-spacing:-.025em}
.rh-date .d2{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:1px}
.copy-btn{
  display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  background:var(--teal);color:#fff;border-radius:11px;padding:9px 11px;
  font-size:12px;font-weight:800;box-shadow:0 6px 14px -10px rgba(15,118,110,1);
}
.copy-btn:active{filter:brightness(.95)}
.sum-chips{display:flex;flex-wrap:wrap;gap:5px}
.sum-chip{
  font-size:12px;font-weight:800;color:#5c776f;
  background:#f5f2ea;border:1px solid var(--line);border-radius:9px;padding:5px 8px;
}
.sum-chip b{color:var(--teal-3);margin-left:3px}
.sum-chip.all{background:linear-gradient(160deg,#fff7e6,#fdefd2);border-color:#f3e2bd;color:#8a6413}
.sum-chip.all b{color:#7a5613}
.read-sec{margin-top:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.read-sec .rh{
  display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:linear-gradient(180deg,#f8f5ee,#f3eee4);border-bottom:1px solid var(--line-2);
}
.read-sec .rh .nm{flex:1;font-weight:800;font-size:14px;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.read-sec .rh .nm .pre{color:var(--muted);font-weight:700;font-size:12px}
.read-sec .rh .tm{font-size:12px;font-weight:800;color:var(--teal-3);background:var(--teal-soft);border-radius:8px;padding:4px 8px;white-space:nowrap;flex:0 0 auto}
.read-sec .rh .tm.none{background:#f4f1e9;color:var(--muted)}
.read-sec .body{padding:11px 13px 13px}
.read-sec .txt{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.read-sec .txt a{color:#2563eb}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.photo-grid button{position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:var(--line-2)}
.photo-grid img{width:100%;height:100%;object-fit:cover}
.private-tag{font-size:10px;font-weight:800;color:#a26;background:#fdeef4;border-radius:6px;padding:2px 5px;margin-left:5px}
.empty{
  text-align:center;padding:30px 18px;color:var(--muted);font-size:13.5px;line-height:1.65;
}
.empty .em{font-size:30px;display:block;margin-bottom:8px}
.empty b{display:block;color:var(--ink-2);font-size:14.5px;margin-bottom:3px}
.empty .btn{margin:14px auto 0;max-width:210px;padding:0 16px}

/* ── Search ─────────────────────────────── */
.search-card{padding:10px 11px}
.search-box{
  display:flex;align-items:center;gap:7px;background:#f7f4ed;border:1px solid var(--line);
  border-radius:12px;padding:0 10px;height:42px;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
.search-box:focus-within{border-color:var(--teal-2);box-shadow:0 0 0 3px var(--teal-soft);background:#fff}
.search-box .ic{font-size:15px;opacity:.55}
.search-box input{flex:1;border:0;background:transparent;height:100%;font-size:14.5px;outline:none}
.search-box input::placeholder{color:#b3bdb8}
.search-box .clr{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:13px;background:#e9e4d9}
.search-meta{display:flex;align-items:center;gap:7px;margin-top:8px}
.sel-wrap{position:relative;flex:1}
.sel-wrap::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:11px}
.filter-sel{
  width:100%;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font-size:12.5px;font-weight:700;color:var(--ink-2);padding:0 26px 0 10px;
}
.result-count{font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.res-group{margin-top:10px}
.res-date{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-2);
  padding:6px 2px 5px;
}
.res-date .k{color:var(--muted);font-weight:700}
.res-item{
  display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;margin-bottom:6px;box-shadow:var(--shadow-sm);
}
.res-item:active{background:#f9f6ef}
.res-item .r1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.res-item .cat{font-size:11.5px;font-weight:800;color:var(--teal-3)}
.res-item .cat.other{color:#9a6c14}
.res-item .snip{font-size:12.5px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-item mark{background:var(--sun-2);color:#6b4d10;border-radius:3px;padding:0 1px;font-weight:800}
.no-res{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}

/* ── Sheet / modal ──────────────────────── */
.backdrop{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(20,32,30,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fade .18s ease;
}
.sheet{
  width:min(520px,100%);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);border-radius:22px 22px 0 0;
  padding:6px 15px calc(18px + var(--safe-b));
  animation:up .24s cubic-bezier(.22,.7,.3,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
}
.grab{width:38px;height:4px;border-radius:3px;background:#ddd6c8;margin:4px auto 8px}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.sheet-head h2{flex:1;font-size:17px;font-weight:900;letter-spacing:-.02em}
.sheet-head .x{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);color:var(--ink-2);font-size:15px;
}
.sheet-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px;box-shadow:var(--shadow-sm)}
.sheet-block h3{font-size:13.5px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.field:last-child{margin-bottom:0}
.field label{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.inp{
  height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 11px;
  font-size:14.5px;font-weight:600;width:100%;
}
.inp:focus{border-color:var(--teal-2);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.55}
.cat-row{
  display:flex;align-items:center;gap:7px;padding:8px 9px;border:1px solid var(--line);
  border-radius:12px;background:#fff;margin-bottom:6px;
}
.cat-row.hidden{opacity:.55;background:#f8f6f1}
.cat-row .cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cat-row .cname{font-size:14px;font-weight:700;border:0;background:transparent;padding:2px 0;width:100%;outline:none;border-bottom:1px dashed transparent}
.cat-row .cname:focus{border-bottom-color:var(--teal-soft-2)}
.cat-row .cm2{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted);font-weight:700}
.cat-row .cm2 label{display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.cat-row .mini-sel{height:24px;border:1px solid var(--line);border-radius:7px;background:#faf8f3;font-size:11px;font-weight:700;padding:0 4px}
.cat-acts{display:flex;gap:3px;flex:0 0 auto}
.cat-acts button{
  width:29px;height:29px;border-radius:8px;display:grid;place-items:center;
  background:#f7f4ed;border:1px solid var(--line);color:var(--ink-2);font-size:12px;
}
.cat-acts button:active{background:var(--teal-soft)}
.cat-acts button.del{color:#c05a5a}
.addcat-form{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:11px;border-top:1px dashed var(--line)}
.addcat-form .ar{display:flex;gap:7px}
.addcat-form .ar .inp{flex:1}
.pretty-check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pretty-check input{width:17px;height:17px;accent-color:var(--teal)}
.btn-line{
  height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-weight:800;font-size:13.5px;color:var(--ink-2);padding:0 14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
}
.btn-line:active{background:#f7f4ed}
.btn-line.teal{color:var(--teal);border-color:var(--teal-soft-2);background:var(--teal-soft)}
.btn-line.danger{color:#b24a4a;border-color:#f0d6d6;background:#fdf2f2}
.two-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-line{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--ink-2);border-bottom:1px dashed var(--line-2)}
.stat-line:last-child{border-bottom:0}
.stat-line b{font-weight:800;color:var(--ink)}

/* ── Lightbox ───────────────────────────── */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(12,18,17,.96);display:flex;align-items:center;justify-content:center;animation:fade .16s ease}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:19px;display:grid;place-items:center}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px;display:grid;place-items:center}
.lb-nav.prev{left:10px}
.lb-nav.next{right:10px}
.lb-count{position:absolute;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:12.5px;font-weight:700;letter-spacing:.04em}

/* ── Toast ──────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:calc(78px + var(--safe-b));transform:translate(-50%,14px);
  background:rgba(28,43,40,.94);color:#fff;font-size:13px;font-weight:700;
  padding:10px 15px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;max-width:min(440px,88vw);text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);line-height:1.45;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .9s linear infinite}

/* ── 보기 도구: 기간 · 영역 · 복사/PDF ─────────────── */
.view-tools{padding:10px 11px 11px;display:flex;flex-direction:column;gap:9px}
.view-tools .search-box{height:40px}
.range-chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:1px 1px 2px}
.range-chips::-webkit-scrollbar{display:none}
.rchip{
  flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;
  transition:background .14s ease,color .14s ease,border-color .14s ease;
}
.rchip.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 5px 12px -9px rgba(15,118,110,.95)}
.rchip:active{transform:scale(.97)}
.range-custom{display:flex;align-items:center;gap:5px}
.range-custom[hidden]{display:none !important}
.date-inp{
  flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font-size:12px;font-weight:700;color:var(--ink-2);padding:0 7px;
}
.date-inp:focus{border-color:var(--teal-2);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.range-custom .tilde{flex:0 0 auto;color:var(--muted);font-weight:800;font-size:12px}
.range-custom .mini-btn{flex:0 0 auto;margin-left:0}
.cat-chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:1px 1px 2px}
.cat-chips::-webkit-scrollbar{display:none}
.cchip{
  flex:0 0 auto;font-size:11.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  color:var(--ink-2);background:#f7f4ed;border:1px solid var(--line);border-radius:9px;padding:5px 8px;
}
.cchip.on{background:var(--teal-soft);border-color:var(--teal-soft-2);color:var(--teal-3)}
.cchip:active{transform:scale(.97)}
.view-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:1px}
.view-meta .result-count{margin-right:auto}
.view-acts{display:flex;gap:6px;margin-left:auto}
.act-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:0 0 auto;
  font-size:11.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  background:var(--teal-soft);color:var(--teal-3);border:1px solid var(--teal-soft-2);
  border-radius:10px;padding:8px 10px;
}
.act-btn.pdf{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 6px 14px -10px rgba(15,118,110,1)}
.act-btn:active{transform:scale(.97)}

/* ── 기간 보기 타임라인 ─────────────────────── */
.rv-head{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-sm);padding:12px 13px;display:flex;flex-direction:column;gap:8px;
}
.rv-title{font-size:15px;font-weight:900;letter-spacing:-.02em;line-height:1.35}
.rv-sub{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:-4px}
.rv-day{display:flex;flex-direction:column;gap:8px;margin:0}
.rv-day-head{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 11px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(180deg,#f8f5ee,#f2ede3);
}
.rv-day-head:active{filter:brightness(.985)}
.rv-day-date{
  flex:1;min-width:0;font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rv-day-sub{
  flex:0 0 auto;font-size:11px;font-weight:800;color:var(--teal-3);
  background:var(--teal-soft);border-radius:8px;padding:3px 7px;white-space:nowrap;
}
.rv-day-chev{flex:0 0 auto;color:var(--muted);font-size:13px;font-weight:800;line-height:1}
.print-only{display:none}
#printArea{display:none}

<body>
<div class="app">

  <header class="topbar">

<script>
(function(){
'use strict';

/* ────────────────────────────── helpers ────────────────────────────── */
var $ = function(id){ return document.getElementById(id); };
var DOW = ['일','월','화','수','목','금','토'];
function pad2(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseYmd(s){ var p=String(s).split('-'); return new Date(+p[0], (+p[1])-1, +p[2]); }
function todayStr(){ return ymd(new Date()); }
function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function fmtMD(s){ var d=parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function fmtFull(s){ var d=parseYmd(s); return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'; }
function fmtShort(s){ var d=parseYmd(s); return (d.getMonth()+1)+'.'+d.getDate()+'('+DOW[d.getDay()]+')'; }
function uid(pre){ return (pre||'c')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmtMin(m){
  m=Math.round(m||0);
  if(m<=0) return '0분';
  if(m<60) return m+'분';
  var h=Math.floor(m/60), r=m%60;
  return h+'시간'+(r?' '+r+'분':'');
}
function fmtCell(m){ m=Math.round(m||0); return m>0 ? m+'m' : '–'; }

/* ────────────────────────────── defaults ────────────────────────────── */
var DEFAULT_CATS = [
  {id:'c_fl',  name:'흘려듣기', timer:true,  group:'english'},
  {id:'c_afl', name:'오디오흘려듣기', timer:true, group:'english'},
  {id:'c_jj',  name:'집중듣기', timer:true,  group:'english'},
  {id:'c_eng', name:'영어책읽기', timer:true, group:'english'},
  {id:'c_kr',  name:'한글책읽기', timer:true, group:'other'},
  {id:'c_st',  name:'학습', timer:true, group:'other'},
  {id:'c_mind',name:'👶 정신건강(산책 놀이 미술 등)', timer:true, group:'other'},
  {id:'c_srch',name:'🧚‍♀️ 써치', timer:true, group:'other'},
  {id:'c_grow',name:'💗 성장일기', timer:true, group:'other'},
  {id:'c_memo',name:'MEMO', timer:false, group:'other'},
  {id:'c_pmemo',name:'비공개MEMO', timer:false, group:'other'}
];
function defaultState(){
  return {
    v:1,
    savedAt:0,
    child:{ name:'래니래니', grade:'초2' },
    categories: clone(DEFAULT_CATS).map(function(c,i){ c.hidden=false; c.order=i; return c; }),
    entries:{},
    drafts:{},
    settings:{ calCollapsed:false, tipDismissed:false, lastBackupAt:0 }
  };
}

var state = defaultState();
var selected = todayStr();
var viewY = 0, viewM = 0;
var current = null;            /* 편집 버퍼 {date, sections, isDraft} */
var activeTab = 'write';
var pendingPhotoCat = null;
var searchQuery = '';
var viewRange = 'day';      /* day | week | 2week | month | lastmonth | custom */
var viewCat = '';           /* '' | 'english' | 카테고리 id */
var rangeFrom = '', rangeTo = '';

/* ────────────────────────────── storage ────────────────────────────── */
var DB_NAME='raeni-diary', DB_VER=1;
var LS_STATE='raeniDiaryStateV1', LS_PHOTOS='raeniDiaryPhotosV1';
var PhotoCache = new Map();     /* id -> {url, blob} */
var idb = null;

function openDB(){
  return new Promise(function(resolve){
    var done=false, finish=function(v){ if(!done){ done=true; resolve(v); } };
    var req;
    try{ req = indexedDB.open(DB_NAME, DB_VER); }catch(e){ return finish(null); }
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
    };
    req.onsuccess = function(){ finish(req.result); };
    req.onerror = function(){ finish(null); };
    req.onblocked = function(){ finish(null); };
    setTimeout(function(){ finish(null); }, 2500);
  });
}
function idbGet(store, key){
  return new Promise(function(res,rej){
    var tx=idb.transaction(store,'readonly');
    var rq=tx.objectStore(store).get(key);
    rq.onsuccess=function(){ res(rq.result); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function idbGetAll(store){
  return new Promise(function(res,rej){
    var tx=idb.transaction(store,'readonly');
    var rq=tx.objectStore(store).getAll();
    rq.onsuccess=function(){ res(rq.result||[]); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function idbPut(store, value, key){
  return new Promise(function(res,rej){
    var tx=idb.transaction(store,'readwrite');
    var os=tx.objectStore(store);
    if(key===undefined) os.put(value); else os.put(value,key);
    tx.oncomplete=function(){ res(true); };
    tx.onerror=function(){ rej(tx.error); };
    tx.onabort=function(){ rej(tx.error||new Error('aborted')); };
  });
}
function idbDel(store,key){
  return new Promise(function(res,rej){
    var tx=idb.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=function(){ res(true); };
    tx.onerror=function(){ rej(tx.error); };
  });
}
function lsGet(k){ try{ var s=localStorage.getItem(k); return s? JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function readLsPhotos(){ var m=lsGet(LS_PHOTOS); return (m&&typeof m==='object')? m : {}; }

function blobToDataURL(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(fr.result); };
    fr.onerror=function(){ rej(fr.error); };
    fr.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataUrl){
  var parts=String(dataUrl).split(',');
  var mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg';
  var bin=atob(parts[1]||'');
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

var PhotoStore = {
  put: async function(id, blob){
    if(idb){
      await idbPut('photos', {id:id, blob:blob}, id);
      PhotoCache.set(id, {url:URL.createObjectURL(blob), blob:blob});
      return;
    }
    var dataUrl = await blobToDataURL(blob);
    var map = readLsPhotos();
    map[id]=dataUrl;
    var ok = lsSet(LS_PHOTOS, map);
    if(!ok) throw new Error('저장 공간이 가득 찼어요. 사진을 줄이거나 백업 후 정리해 주세요');
    PhotoCache.set(id, {url:dataUrl, blob:blob});
  },
  del: async function(id){
    if(idb){ try{ await idbDel('photos', id); }catch(e){} }
    else {
      var map=readLsPhotos(); delete map[id]; lsSet(LS_PHOTOS, map);
    }
    var rec=PhotoCache.get(id);
    if(rec && rec.url && rec.url.indexOf('blob:')===0){ try{ URL.revokeObjectURL(rec.url); }catch(e){} }
    PhotoCache.delete(id);
  },
  url: function(id){ var r=PhotoCache.get(id); return r? r.url : ''; },
  count: function(){ return PhotoCache.size; }
};

var saveTimer=null, savePending=false, saveWarned=false;
function storageUsable(){
  try{
    localStorage.setItem('__raeniTest','1');
    localStorage.removeItem('__raeniTest');
    return true;
  }catch(e){ return false; }
}

function scheduleSave(){
  savePending=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ saveNow(); }, 450);
}
async function saveNow(){
  clearTimeout(saveTimer);
  savePending=false;
  state.savedAt = Date.now();
  var payload = {kind:'state', data: state};
  try{
    if(idb){ await idbPut('kv', payload, 'state'); }
    lsSet(LS_STATE, state);                      /* 안전용 사본 */
  }catch(err){
    console.warn('save failed', err);
    if(!lsSet(LS_STATE, state) && !saveWarned){
      saveWarned=true;
      toast('저장 공간이 부족해 저장하지 못했어요. 설정에서 백업해 주세요', 4000);
    }
  }
}

async function loadState(){
  idb = await openDB();
  var fromIdb=null;
  if(idb){
    try{
      var row = await idbGet('kv','state');
      if(row && row.data) fromIdb = row.data;
      var photos = await idbGetAll('photos');
      (photos||[]).forEach(function(p){
        if(p && p.id && p.blob){ try{ PhotoCache.set(p.id, {url:URL.createObjectURL(p.blob), blob:p.blob}); }catch(e){} }
      });
    }catch(e){ console.warn('idb load failed', e); }
  }
  var fromLs = lsGet(LS_STATE);
  if(fromLs && !fromLs.entries) fromLs=null;
  /* 어느 쪽이 더 최신인지 비교해 고른다 (저장 실패 대비) */
  var saved=null;
  if(fromIdb && fromLs){
    saved = (Number(fromLs.savedAt)||0) > (Number(fromIdb.savedAt)||0) ? fromLs : fromIdb;
  } else {
    saved = fromIdb || fromLs;
  }
  if(!idb || saved===fromLs){
    var pm = readLsPhotos();
    Object.keys(pm).forEach(function(id){ if(!PhotoCache.has(id)) PhotoCache.set(id, {url:pm[id]}); });
  }
  if(saved) state = normalizeState(saved);
}

/* ────────────────────────────── model ────────────────────────────── */
function normalizeSections(raw, dropEmpty){
  var out={};
  if(!raw || typeof raw!=='object') return out;
  Object.keys(raw).forEach(function(cid){
    var s=raw[cid]; if(!s || typeof s!=='object') return;
    var m=Math.max(0, Math.round(Number(s.m)||0));
    var t=typeof s.t==='string'? s.t : '';
    var p=Array.isArray(s.p)? s.p.filter(function(x){ return typeof x==='string'; }) : [];
    if(dropEmpty && !m && !t.trim() && !p.length) return;
    out[cid]={m:m, t:t, p:p};
  });
  return out;
}
function normalizeState(s){
  var out=defaultState();
  if(!s) return out;
  if(s.child) out.child={ name:String(s.child.name||'래니래니'), grade:String(s.child.grade||'초2') };
  if(Array.isArray(s.categories) && s.categories.length){
    out.categories = s.categories.map(function(c,i){
      return {
        id: String(c.id || ('c'+i+'_'+Math.random().toString(36).slice(2,6))),
        name: String(c.name||'영역'),
        timer: c.timer!==false,
        group: c.group==='english'?'english':'other',
        hidden: !!c.hidden,
        order: i
      };
    });
  }
  var e={};
  if(s.entries && typeof s.entries==='object'){
    Object.keys(s.entries).forEach(function(d){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      var en=s.entries[d]; if(!en) return;
      var secs=normalizeSections(en.sections, true);
      if(Object.keys(secs).length) e[d]={sections:secs, savedAt: Number(en.savedAt)||0};
    });
  }
  out.entries=e;
  var dr={};
  if(s.drafts && typeof s.drafts==='object'){
    Object.keys(s.drafts).forEach(function(d){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      var de=s.drafts[d]; if(!de) return;
      dr[d]={sections:normalizeSections(de.sections, false), at: Number(de.at)||0};
    });
  }
  out.drafts=dr;
  out.settings = Object.assign({}, out.settings, s.settings||{});
  out.savedAt = Number(s.savedAt)||0;
  return out;
}

function visibleCats(){ return state.categories.filter(function(c){ return !c.hidden; }); }
function catById(id){ for(var i=0;i<state.categories.length;i++){ if(state.categories[i].id===id) return state.categories[i]; } return null; }
function isEnglish(c){ return c && c.group==='english'; }
function catLabel(c){ if(!c) return ''; return (isEnglish(c) && !/^영어/.test(c.name)) ? '영어 › '+c.name : c.name; }
function catBase(c){ if(!c) return ''; return c.name.replace(/^영어\s*[>›]\s*/,''); }
function isPrivate(c){ return /비공개/.test((c&&c.name)||''); }

function sectionsOf(date){ var e=state.entries[date]; return (e&&e.sections)||{}; }
function hasContent(sec){ return !!sec && ((Number(sec.m)||0)>0 || !!(sec.t&&sec.t.trim()) || !!(sec.p&&sec.p.length)); }
function dayHasRecord(date){
  var s=sectionsOf(date);
  return Object.keys(s).some(function(k){ return hasContent(s[k]); });
}
function dayPhotoCount(date){
  var s=sectionsOf(date), n=0;
  Object.keys(s).forEach(function(k){ n += (s[k].p||[]).length; });
  return n;
}
function calcTotals(sections){
  var en=0, other=0;
  var cats=visibleCats();
  for(var i=0;i<cats.length;i++){
    var run=sections[cats[i].id];
    var m=run? (Number(run.m)||0) : 0;
    if(m<=0) continue;
    if(isEnglish(cats[i])) en+=m; else other+=m;
  }
  return {en:en, other:other, all:en+other};
}
function weekStartOf(ds){
  var d=parseYmd(ds);
  var diff=(d.getDay()+6)%7;   /* 월요일 시작 */
  d.setDate(d.getDate()-diff);
  return ymd(d);
}
function childLabel(){ return state.child.name+' ('+state.child.grade+')'; }

/* ────────────────────────────── editor buffer ────────────────────────────── */
function loadEditor(date){
  var draft=state.drafts[date];
  var src=draft || state.entries[date] || null;
  current={ date:date, sections: normalizeSections(src&&src.sections, false), isDraft: !!draft };
}
function ensureSec(cid){
  if(!current) return null;
  if(!current.sections[cid]) current.sections[cid]={m:0,t:'',p:[]};
  var s=current.sections[cid];
  if(!s.p) s.p=[];
  return s;
}
function markEdited(){
  if(!current) return;
  current.isDraft=true;
  state.drafts[current.date]={sections: current.sections, at: Date.now()};
  $('draftBadge').hidden=false;
  scheduleSave();
  updateTodayAnalysis();
  syncJumpBar();
}

/* ────────────────────────────── toast ────────────────────────────── */
var toastTimer=null;
function toast(msg, ms){
  var el=$('toast');
  el.textContent=msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('on'); }, ms||2200);
}

/* ────────────────────────────── render: header ────────────────────────────── */
function renderHeader(){
  var nm=state.child.name||'래니래니';
  var gr=state.child.grade||'';
  $('childTitle').innerHTML = esc(nm)+(gr? ' <small>('+esc(gr)+')</small>' : '');
  $('mascot').textContent = nm.charAt(0)||'래';

function renderCalendar(){
  var t=parseYmd(selected);
  if(!viewY){ viewY=t.getFullYear(); viewM=t.getMonth(); }
  $('calTitle').textContent = viewY+'년 '+(viewM+1)+'월';
  var first=new Date(viewY, viewM, 1);
  var startDow=first.getDay();
  var daysInMonth=new Date(viewY, viewM+1, 0).getDate();
  var prevDays=new Date(viewY, viewM, 0).getDate();
  var today=todayStr();
  var cells=[];
  for(var i=0;i<42;i++){
    var offset=i-startDow;
    var d, inMonth=true;
    if(offset<0){ d=new Date(viewY, viewM-1, prevDays+offset+1); inMonth=false; }
    else if(offset>=daysInMonth){ d=new Date(viewY, viewM+1, offset-daysInMonth+1); inMonth=false; }
    else { d=new Date(viewY, viewM, offset+1); }
    var ds=ymd(d);
    var dow=d.getDay();
    var cls='cal-cell';
    if(!inMonth) cls+=' out';
    if(dow===0) cls+=' sun';
    if(dow===6) cls+=' sat';
    if(dayHasRecord(ds)) cls+=' has';
    if(ds===today) cls+=' today';
    if(ds===selected) cls+=' sel';
    cells.push('<button class="'+cls+'" data-date="'+ds+'" aria-label="'+fmtFull(ds)+(dayHasRecord(ds)?' 기록 있음':'')+'"><span class="num">'+d.getDate()+'</span></button>');
  }
  $('calGrid').innerHTML=cells.join('');
  var collapsed=!!state.settings.calCollapsed;
  $('calCard').classList.toggle('collapsed', collapsed);
  $('calToggle').setAttribute('aria-label', collapsed?'달력 펼치기':'달력 접기');
}

function updateWeekAnalysis(){
  var sub=$('weekSub'), tbl=$('weekTable');
  if(!sub || !tbl || !current) return;
  var ws=weekStartOf(current.date), we=addDays(ws,6);
  var total=0;
  for(var i=0;i<7;i++){
    var ds=addDays(ws,i);
    total += calcTotals(ds===current.date? current.sections : sectionsOf(ds)).all;
  }
  sub.textContent = fmtMD(ws)+' ~ '+fmtMD(we)+' · 월~일 · 이번 주 '+fmtMin(total);
  tbl.innerHTML = weeklyTableHTML(current.date, current.sections);
}
function weeklyTableHTML(ds, override){
  var start=weekStartOf(ds);
  var days=[];
  for(var i=0;i<7;i++) days.push(addDays(start,i));
  var cats=visibleCats().filter(function(c){ return c.timer; });
  function secsAt(d){ return (override && d===ds)? override : sectionsOf(d); }
  var perDay=days.map(function(d){ return calcTotals(secsAt(d)); });
  function sumOf(getter){
    var arr=days.map(function(d,i){ return getter(d,i); });
    var sum=arr.reduce(function(a,b){ return a+b; },0);
    return {arr:arr, sum:sum, avg: sum/7};
  }
  var head='<tr><th class="nm">영역</th>'+days.map(function(d){
    return '<th>'+DOW[parseYmd(d).getDay()]+'</th>';
  }).join('')+'<th>주간합계</th><th>일평균</th></tr>';
  var body=cats.map(function(c){
    var r=sumOf(function(d){ var s=secsAt(d)[c.id]; return s? Math.max(0,Math.round(Number(s.m)||0)) : 0; });
    return '<tr><td class="nm"><i class="gd'+(isEnglish(c)?'':' other')+'"></i>'+esc(catBase(c))+'</td>'
      +r.arr.map(function(m){ return '<td class="'+(m?'has':'dim')+'">'+(m? m+'m':'–')+'</td>'; }).join('')
      +'<td class="'+(r.sum?'':'dim')+'">'+(r.sum? fmtMin(r.sum):'–')+'</td>'
      +'<td class="'+(r.sum?'':'dim')+'">'+(r.sum? Math.round(r.avg)+'분':'–')+'</td></tr>';
  }).join('');
  var en=sumOf(function(d,i){ return perDay[i].en; });
  var ot=sumOf(function(d,i){ return perDay[i].other; });
  var al=sumOf(function(d,i){ return perDay[i].all; });
  function totRow(label,r){
    return '<tr class="total"><td class="nm">'+label+'</td>'
      +r.arr.map(function(m){ return '<td>'+(m? m+'m':'–')+'</td>'; }).join('')
      +'<td>'+(r.sum? fmtMin(r.sum):'–')+'</td><td>'+(r.sum? Math.round(r.avg)+'분':'–')+'</td></tr>';
  }
  return '<div class="tbl-wrap"><table class="tbl">'
    +'<thead>'+head+'</thead><tbody>'+body
    +totRow('영어 합계',en)+totRow('영어 외 합계',ot)+totRow('전체 합계',al)
    +'</tbody></table></div>';
}

/* ── 기간 계산 ── */
function selectedMonth(){
  var d=parseYmd(selected);
  return {y:d.getFullYear(), m:d.getMonth()};
}
function monthAnchor(){
  /* 달력에 보이는 달을 따른다 (달력 화살표로 넘긴 달과 화면을 맞추기 위해) */
  if(typeof viewY==='number' && viewY>0 && viewM>=0) return {y:viewY, m:viewM};
  return selectedMonth();
}
function monthRange(y, m){
  var last=new Date(y, m+1, 0).getDate();
  return {from:y+'-'+pad2(m+1)+'-01', to:y+'-'+pad2(m+1)+'-'+pad2(last)};
}
function rangeDays(){
  var out=[], i;
  if(viewRange==='week'){ for(i=6;i>=0;i--) out.push(addDays(selected,-i)); return out; }
  if(viewRange==='2week'){ for(i=13;i>=0;i--) out.push(addDays(selected,-i)); return out; }
  if(viewRange==='month' || viewRange==='lastmonth'){
    var mm=monthAnchor(), y=mm.y, m=mm.m;
    if(viewRange==='lastmonth'){ m--; if(m<0){ m=11; y--; } }
    var b=monthRange(y,m);
    for(var d=parseYmd(b.from); ymd(d)<=b.to; d.setDate(d.getDate()+1)) out.push(ymd(d));
    return out;
  }
  if(viewRange==='custom'){
    var f=rangeFrom||selected, t=rangeTo||selected;
    if(f>t){ var tmp=f; f=t; t=tmp; }
    var guard=0;
    for(var c=parseYmd(f); ymd(c)<=t && guard<400; c.setDate(c.getDate()+1)){ out.push(ymd(c)); guard++; }
    return out;
  }
  return [selected];   /* day */
}
function rangeTitle(){
  var days=rangeDays(), a=days[0], b=days[days.length-1];
  if(viewRange==='day') return fmtFull(a);
  if(viewRange==='month' || viewRange==='lastmonth'){
    var d=parseYmd(a);
    return d.getFullYear()+'년 '+(d.getMonth()+1)+'월';
  }
  return fmtFull(a)+' ~ '+fmtFull(b);
}

/* ── 영역 거르기 ── */
function viewCats(){
  var cats=visibleCats();
  if(!viewCat) return cats;
  if(viewCat==='english') return cats.filter(function(c){ return isEnglish(c); });
  return cats.filter(function(c){ return c.id===viewCat; });
}
function catFilterValid(){
  if(!viewCat) return true;
  if(viewCat==='english') return true;
  return visibleCats().some(function(c){ return c.id===viewCat; });
}
function catFilterLabel(){
  if(!viewCat) return '전체 영역';
  if(viewCat==='english') return '영어 전체';
  var c=catById(viewCat);
  return c? catLabel(c) : '전체 영역';
}
function daySubtotal(ds, cats){
  var secs=sectionsOf(ds), en=0, other=0;
  (cats||viewCats()).forEach(function(c){
    var s=secs[c.id]; if(!s) return;
    var m=Math.max(0, Math.round(Number(s.m)||0));
    if(!m) return;
    if(isEnglish(c)) en+=m; else other+=m;
  });
  return {en:en, other:other, all:en+other};
}

/* ── 지금 화면에 보이는 기록 묶음 ── */
function viewModel(){
  var q=searchQuery.trim();
  var cats=viewCats();
  if(q){
    var ql=q.toLowerCase(), hitsDays=[];
    Object.keys(state.entries).sort().forEach(function(ds){
      var secs=sectionsOf(ds);
      var hits=cats.filter(function(c){
        var s=secs[c.id];
        if(!hasContent(s)) return false;
        if(catLabel(c).toLowerCase().indexOf(ql)>=0) return true;
        return (s.t||'').toLowerCase().indexOf(ql)>=0;
      });
      if(hits.length) hitsDays.push({ds:ds, cats:hits});
    });
    return {mode:'search', q:q, cats:cats, days:hitsDays};
  }
  var list=[];
  rangeDays().forEach(function(ds){
    var secs=sectionsOf(ds);
    var cs=cats.filter(function(c){ return hasContent(secs[c.id]); });
    if(cs.length) list.push({ds:ds, cats:cs});
  });
  return {mode:'range', cats:cats, days:list};
}
function modelTotals(model){
  var t={en:0, other:0, all:0, photos:0, sections:0};
  model.days.forEach(function(d){
    var secs=sectionsOf(d.ds);
    var sub=daySubtotal(d.ds, d.cats);
    t.en+=sub.en; t.other+=sub.other; t.all+=sub.all;
    d.cats.forEach(function(c){
      var s=secs[c.id]; if(!s) return;
      t.sections++;
      t.photos+=(s.p||[]).filter(function(id){ return PhotoCache.has(id); }).length;
    });
  });
  return t;
}
function modelAnalysisTableHTML(model, tot, headLabel){
  var cats=(model.cats||visibleCats()).filter(function(c){ return c.timer; });
  var per={};
  cats.forEach(function(c){ per[c.id]=0; });
  model.days.forEach(function(d){
    var secs=sectionsOf(d.ds);
    d.cats.forEach(function(c){
      var s=secs[c.id]; if(!s) return;
      var m=Math.max(0, Math.round(Number(s.m)||0));
      if(!m) return;
      if(per[c.id]===undefined) per[c.id]=0;
      per[c.id]+=m;
    });
  });
  var total=tot? tot.all : 0, max=1;
  Object.keys(per).forEach(function(k){ if(per[k]>max) max=per[k]; });
  var rows=cats.map(function(c){
    var m=per[c.id]||0, pct=total? Math.round(m/total*100) : 0, w=total? Math.round(m/max*100) : 0;
    return '<tr>'
      +'<td class="nm"><i class="gd'+(isEnglish(c)?'':' other')+'"></i>'+esc(catBase(c))+'</td>'
      +'<td class="'+(m?'has':'dim')+'">'+(m? fmtMin(m) : '–')+'</td>'
      +'<td><div class="bar" title="'+(m?pct+'%':'0%')+'"><i style="width:'+w+'%"></i></div></td>'
      +'<td class="'+(m?'':'dim')+'">'+(m? pct+'%' : '–')+'</td>'
    +'</tr>';
  }).join('');
  if(!rows) rows='<tr><td colspan="4" class="dim">표시할 영역이 없어요</td></tr>';
  return '<div class="tbl-wrap"><table class="tbl">'
    +'<thead><tr><th class="nm">영역</th><th>'+(headLabel||'합계')+'</th><th>비중</th><th>%</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
}

/* ────────────────────────────── search ────────────────────────────── */
function highlightHTML(text, q){
  if(!q) return esc(text);
  var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  var out='', last=0, m;
  while((m=re.exec(text))!==null){
    out+=esc(text.slice(last, m.index))+'<mark>'+esc(m[0])+'</mark>';
    last=m.index+m[0].length;
    if(!m[0].length) re.lastIndex++;
  }
  return out+esc(text.slice(last));
}
function snippetHTML(text, q){
  var i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text.slice(0,90));
  var start=Math.max(0, i-26), end=Math.min(text.length, i+q.length+60);
  var slice=(start>0?'…':'')+text.slice(start,end)+(end<text.length?'…':'');
  return highlightHTML(slice, q);
}

function copyText(t){
  var done=function(){ toast('전체 내용을 복사했어요 ✅'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(function(){ legacyCopy(t) ? done() : toast('복사가 안 됐어요. 화면을 길게 눌러 복사해 주세요'); });
  } else {
    legacyCopy(t) ? done() : toast('복사가 안 됐어요. 화면을 길게 눌러 복사해 주세요');
  }
}
function legacyCopy(t){
  try{
    var ta=document.createElement('textarea');
    ta.value=t;
    ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok=document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

/* ────────────────────────────── PDF 저장 (인쇄) ──────────────────────────────
   외부 라이브러리 없이 @media print 서식 + window.print()만 쓴다.
   지금 화면에 보이는 기간·영역(또는 검색 결과)을 #printArea에 A4 문서로 만들고
   window.print()로 인쇄한다. afterprint 뒤에는 화면을 원래대로 되돌린다. */
var printGuard=null, printRestore=null;

function isPrinting(){
  return document.body.classList.contains('print-doc');
}
function whenImagesReady(root){
  var imgs = root ? Array.prototype.slice.call(root.querySelectorAll('img')) : [];
  var waits=[];
  imgs.forEach(function(im){
    if(im.complete && im.naturalWidth) return;
    waits.push(new Promise(function(res){
      var done=function(){ im.removeEventListener('load',done); im.removeEventListener('error',done); res(); };
      im.addEventListener('load',done);
      im.addEventListener('error',done);
    }));
  });
  if(!waits.length) return Promise.resolve();
  return Promise.race([Promise.all(waits), new Promise(function(res){ setTimeout(res, 1800); })]);
}
function firePrint(container){
  whenImagesReady(container).then(function(){
    setTimeout(function(){
      if(!isPrinting()) return;
      printGuard=setTimeout(endPrint, 30000);   /* afterprint가 안 오는 브라우저용 안전장치 */
      try{ window.print(); }
      catch(e){ endPrint(); toast('인쇄 창을 열지 못했어요. 브라우저 메뉴의 ‘인쇄’를 써 주세요'); }
    }, 60);
  });
}
function endPrint(){
  if(printGuard){ clearTimeout(printGuard); printGuard=null; }
  var was=isPrinting();
  document.body.classList.remove('print-doc');
  if(!was) return;
  var restore=printRestore; printRestore=null;
  if(restore){ try{ restore(); }catch(e){ console.warn('print restore failed', e); } }
}
function buildPrintHTML(model){

  }
  days.sort(function(a,b){ return a.ds<b.ds? -1 : (a.ds>b.ds? 1 : 0); });
  var title = model.mode==='search' ? '‘'+model.q+'’ 검색 결과' : (rangeTitle()+' 학습노트');
  var sub = (model.mode==='search'? '전체 기간 검색 · ' : '')

  var single = (model.mode==='range' && days.length===1 && viewRange==='day' && !viewCat);
  if(single){

    html+='<section class="analysis"><h3>Today 결과분석</h3>'

    var ws=weekStartOf(ds), weekTotal=0;

    if(weekTotal>0){
      html+='<section class="analysis"><h3>Weekly 결과분석</h3>'
        +'<div class="sub">'+fmtMD(ws)+' ~ '+fmtMD(addDays(ws,6))+' · 월~일</div>'
        +weeklyTableHTML(ds)+'</section>';
    }
  } else if(days.length){
    var aHead = model.mode==='search'? '검색 결과 분석' : (viewRange==='day'? 'Today 결과분석' : '기간 결과분석');
    var aSub = model.mode==='search'? (title+' · 기록 '+days.length+'일')

    html+='<section class="analysis"><h3>'+aHead+'</h3>'

  }
  html+='<div class="pa-foot"><span>'+esc(childLabel())+'</span><span>'+esc(title)+' · '+fmtFull(todayStr())+' 출력</span></div>';
  return html;
}

async function fillStorageInfo(el){
  if(!el) return;
  var days=Object.keys(state.entries).length;
  var photos=PhotoCache.size;
  var bytes=0;
  PhotoCache.forEach(function(r){
    if(r.blob && r.blob.size) bytes+=r.blob.size;
    else if(r.url && r.url.indexOf('data:')===0) bytes+=r.url.length*0.75;
  });
  var usage='';
  try{
    if(navigator.storage && navigator.storage.estimate){
      var est=await navigator.storage.estimate();
      if(est && est.usage) usage=(est.usage/1048576).toFixed(1)+' MB';
    }
  }catch(e){}
  el.innerHTML=''
    +'<div class="stat-line"><span>기록한 날</span><b>'+days+'일</b></div>'
    +'<div class="stat-line"><span>사진</span><b>'+photos+'장 · '+(bytes/1048576).toFixed(1)+' MB</b></div>'
    +'<div class="stat-line"><span>저장 방식</span><b>'+(idb? 'IndexedDB (든든)' : 'localStorage (간이)')+'</b></div>'
    +(usage? '<div class="stat-line"><span>브라우저 전체 사용량</span><b>'+usage+'</b></div>' : '');
}

function attachCatListEvents(root, list){
  if(list.getAttribute('data-bound')==='1') return;
  list.setAttribute('data-bound','1');
  list.addEventListener('change', function(e){
    var row=e.target.closest('.cat-row'); if(!row) return;
    var idx=catIndexById(row.dataset.id); if(idx<0) return;
    var f=e.target.getAttribute('data-f');
    if(f==='timer'){ state.categories[idx].timer=!!e.target.checked; }
    else if(f==='group'){ state.categories[idx].group=e.target.value==='english'?'english':'other'; }
    else if(e.target.classList.contains('cname')){
      var v=e.target.value.trim();
      if(!v){ e.target.value=state.categories[idx].name; toast('이름은 비워 둘 수 없어요'); return; }
      state.categories[idx].name=v;
    }
    persistCats(root);
  });
  list.addEventListener('click', function(e){
    var btn=e.target.closest('[data-a]'); if(!btn) return;
    var row=btn.closest('.cat-row'); if(!row) return;
    var idx=catIndexById(row.dataset.id); if(idx<0) return;
    var a=btn.getAttribute('data-a');
    var cats=state.categories;
    if(a==='up' && idx>0){
      var tmp=cats[idx-1]; cats[idx-1]=cats[idx]; cats[idx]=tmp;
    } else if(a==='down' && idx<cats.length-1){
      var tmp2=cats[idx+1]; cats[idx+1]=cats[idx]; cats[idx]=tmp2;
    } else if(a==='hide'){
      cats[idx].hidden=!cats[idx].hidden;
    } else if(a==='del'){
      var nm=catLabel(cats[idx]);
      if(!window.confirm('‘'+nm+'’ 영역을 지울까요?\n이 영역의 지난 기록은 화면에서 안 보이게 돼요(백업 파일에는 남아 있어요).')) return;
      cats.splice(idx,1);
    } else return;
    persistCats(root);
    if(a==='del'||a==='hide') toast('영역을 정리했어요');
  });
}

async function exportBackup(){
  try{
    toast('백업 파일을 만드는 중… 사진이 많으면 조금 걸려요', 5000);
    var photos={};
    var entries=Array.from(PhotoCache.entries());
    for(var i=0;i<entries.length;i++){
      var id=entries[i][0], rec=entries[i][1];
      try{
        if(rec.blob) photos[id]=await blobToDataURL(rec.blob);
        else if(rec.url && rec.url.indexOf('data:')===0) photos[id]=rec.url;
      }catch(e){}
    }
    state.settings.lastBackupAt=Date.now();
    var payload={app:'raeni-diary', v:1, exportedAt:new Date().toISOString(), child:state.child, state:state, photos:photos};
    var blob=new Blob([JSON.stringify(payload)], {type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download=state.child.name+'-학습다이어리-'+todayStr()+'.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1500);
    await saveNow();
    toast('백업 파일을 저장했어요 (다운로드 폴더 확인)');
  }catch(e){
    console.warn(e);
    toast('백업을 만들지 못했어요: '+(e.message||'오류'));
  }
}
function importBackupFile(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    var data;
    try{ data=JSON.parse(String(reader.result)); }
    catch(e){ toast('백업 파일을 읽을 수 없어요 (JSON 형식 아님)'); return; }
    if(!data || data.app!=='raeni-diary' || !data.state){ toast('이 앱의 백업 파일이 아니에요'); return; }
    var n=Object.keys(data.state.entries||{}).length;
    if(!window.confirm('백업 파일의 기록 '+n+'일로 지금 기기 기록을 바꿀까요?\n지금 기록은 사라져요. (필요하면 먼저 내보내기 해 주세요)')) return;
    (async function(){
      try{
        var photoMap=data.photos||{};
        var ids=Object.keys(photoMap);
        var restored=0;
        for(var i=0;i<ids.length;i++){
          try{
            var blob=dataURLToBlob(photoMap[ids[i]]);
            await PhotoStore.put(ids[i], blob);
            restored++;
          }catch(e){}
        }
        state=normalizeState(data.state);
        await saveNow();
        selected=todayStr();
        viewY=parseYmd(selected).getFullYear(); viewM=parseYmd(selected).getMonth();
        renderAll();
        closeSheet();
        toast('백업을 불러왔어요 · 기록 '+n+'일, 사진 '+restored+'장');
      }catch(e){
        console.warn(e);
        toast('불러오기 중 문제가 생겼어요: '+(e.message||'오류'));
      }
    })();
  };
  reader.onerror=function(){ toast('파일을 읽지 못했어요'); };
  reader.readAsText(file);
}

function compressImage(file, maxDim, quality){
  maxDim=maxDim||1600; quality=quality||0.82;
  return new Promise(function(resolve,reject){
    if(!/^image\//.test(file.type)){ reject(new Error('이미지가 아니에요')); return; }
    var url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      try{
        var scale=Math.min(1, maxDim/Math.max(w,h));
        var cw=Math.max(1, Math.round(w*scale)), ch=Math.max(1, Math.round(h*scale));
        var cv=document.createElement('canvas');
        cv.width=cw; cv.height=ch;
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        var done=function(blob){
          URL.revokeObjectURL(url);
          if(blob) resolve(blob);
          else { try{ resolve(dataURLToBlob(cv.toDataURL('image/jpeg',quality))); }catch(e){ reject(new Error('변환 실패')); } }
        };
        if(cv.toBlob) cv.toBlob(done,'image/jpeg',quality);
        else done(null);
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('사진을 읽을 수 없어요')); };
    img.src=url;
  });
}
async function removePhoto(cid, pid){
  var sec=ensureSec(cid); if(!sec) return;
  var i=sec.p.indexOf(pid);
  if(i>=0) sec.p.splice(i,1);
  markEdited();
  renderSections();
  try{ await PhotoStore.del(pid); }catch(e){}
  toast('사진을 지웠어요');
}
async function handlePhotoFiles(files){
  var cid=pendingPhotoCat; pendingPhotoCat=null;
  if(!cid || !files || !files.length) return;
  var cat=catById(cid); if(!cat) return;
  var sec=ensureSec(cid); if(!sec) return;
  var added=0, failed=0;
  toast('사진 '+files.length+'장을 가볍게 압축하는 중…', 6000);
  for(var i=0;i<files.length;i++){
    try{
      var blob=await compressImage(files[i]);
      var id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await PhotoStore.put(id, blob);
      sec.p.push(id);
      added++;
    }catch(err){ console.warn('photo fail', err); failed++; }
  }
  if(added){
    markEdited();
    renderSections();
    toast(added+'장 추가했어요'+(failed? ' · '+failed+'장 실패':''));
  } else {
    toast('사진을 넣지 못했어요. 다른 사진으로 해보세요');
  }
}

    var art=document.querySelector('#sections .sec[data-cat="'+b.getAttribute('data-jump')+'"]');
    if(art && art.scrollIntoView) art.scrollIntoView({behavior:'smooth', block:'center'});
  });

  /* 섹션 입력 */
  $('sections').addEventListener('input', function(e){
    var t=e.target;
    var art=t.closest ? t.closest('[data-cat]') : null;
    if(!art || !current) return;
    var cid=art.getAttribute('data-cat');
    if(t.tagName==='TEXTAREA'){
      var sec=ensureSec(cid); if(!sec) return;
      sec.t=t.value;
      autoGrow(t);
      art.classList.toggle('is-filled', hasContent(sec));
      markEdited();
      return;
    }
    if(t.classList && t.classList.contains('tin')){
      var sec2=ensureSec(cid); if(!sec2) return;
      var hIn=art.querySelector('[data-field="h"]');
      var mIn=art.querySelector('[data-field="m"]');
      var h=parseInt(hIn.value,10); if(isNaN(h)||h<0) h=0; if(h>99) h=99;
      var mm=parseInt(mIn.value,10); if(isNaN(mm)||mm<0) mm=0; if(mm>59) mm=59;
      if(hIn.value!=='' && String(h)!==hIn.value && parseInt(hIn.value,10)>99) hIn.value=h;
      if(mIn.value!=='' && parseInt(mIn.value,10)>59) mIn.value=mm;
      sec2.m=h*60+mm;
      Array.prototype.forEach.call(art.querySelectorAll('.chip[data-min]'), function(ch){
        ch.classList.toggle('on', (parseInt(ch.getAttribute('data-min'),10)||0)===sec2.m);
      });
      art.classList.toggle('is-filled', hasContent(sec2));
      markEdited();
    }
  });

  /* 섹션 클릭 */
  $('sections').addEventListener('click', function(e){
    var act=e.target.closest('[data-act]');
    if(!act) return;
    var art=act.closest('[data-cat]');
    var cid=art? art.getAttribute('data-cat') : null;
    var a=act.getAttribute('data-act');
    if(a==='photo'){
      e.preventDefault();
      pendingPhotoCat=cid;
      $('photoInput').value='';
      $('photoInput').click();
      return;
    }
    if(a==='preset'){
      var m=parseInt(act.getAttribute('data-min'),10)||0;
      var sec=ensureSec(cid);
      if(!sec) return;
      sec.m=m;
      updateTimeUI(art, m);
      markEdited();
      return;
    }
    if(a==='delphoto'){
      e.preventDefault();
      removePhoto(cid, act.getAttribute('data-pid'));
      return;
    }
    if(a==='viewphoto'){
      var pids=String(act.getAttribute('data-pids')||'').split(',').filter(Boolean);
      openLightbox(pids, parseInt(act.getAttribute('data-idx'),10)||0);
      return;
    }
  });

  /* 사진 선택 */
  $('photoInput').addEventListener('change', function(e){
    var files=Array.prototype.slice.call(e.target.files||[]);
    e.target.value='';
    handlePhotoFiles(files);
  });

  /* 하단 버튼 */
  $('btnSave').addEventListener('click', doSave);
  $('btnDraft').addEventListener('click', doDraft);
  $('btnReset').addEventListener('click', doReset);
  $('btnAddCat').addEventListener('click', openCatManager);
  $('btnSettings').addEventListener('click', openSettings);

  /* 팁 배너 */
  $('tipClose').addEventListener('click', function(){
    state.settings.tipDismissed=true;
    applyTip();
    saveNow();
  });

  /* 검색 */
  $('searchInput').addEventListener('input', function(e){
    searchQuery=e.target.value;
    $('searchClear').hidden=!searchQuery;
    clearTimeout(searchTimer);
    searchTimer=setTimeout(runSearch, 160);
  });
  $('searchInput').addEventListener('search', function(e){
    searchQuery=e.target.value;
    $('searchClear').hidden=!searchQuery;
    runSearch();
  });
  $('searchClear').addEventListener('click', function(){
    searchQuery='';
    $('searchInput').value='';
    $('searchClear').hidden=true;
    runSearch();
    $('searchInput').focus();
  });

  /* 기간 · 영역 칩 */
  $('rangeChips').addEventListener('click', function(e){
    var b=e.target.closest('[data-range]');
    if(!b) return;
    setRange(b.getAttribute('data-range'));
  });
  $('rangeApply').addEventListener('click', applyCustomRange);
  $('rangeFrom').addEventListener('change', applyCustomRange);
  $('rangeTo').addEventListener('change', applyCustomRange);
  $('viewCatChips').addEventListener('click', function(e){
    var b=e.target.closest('[data-vcat]');
    if(!b) return;
    setViewCat(b.getAttribute('data-vcat'));
  });

  /* 보기 도구의 복사 · PDF */
  document.querySelector('.view-tools').addEventListener('click', function(e){
    var b=e.target.closest('[data-act]');
    if(!b) return;
    var a=b.getAttribute('data-act');
    if(a==='copyall'){ copyText(buildViewText(viewModel())); }
    else if(a==='printview'){ doPrintView(); }
  });

  /* 검색 결과 → 그 날 보기 */
  $('searchResults').addEventListener('click', function(e){
    var b=e.target.closest('.res-item');
    if(!b) return;
    var ds=b.getAttribute('data-date');
    searchQuery='';
    $('searchInput').value=''; $('searchClear').hidden=true;
    $('searchResults').hidden=true;
    $('readContent').hidden=false;
    viewRange='day'; saveView(); syncRangeUI();
    selectDate(ds);
    window.scrollTo(0,0);
    toast('그 날 기록으로 이동했어요');
  });

  /* 보기 탭 안 버튼 */
  $('readContent').addEventListener('click', function(e){
    var act=e.target.closest('[data-act]');
    if(!act) return;
    var a=act.getAttribute('data-act');
    if(a==='openday'){
      var ds=act.getAttribute('data-date');
      viewRange='day'; saveView(); syncRangeUI();
      selectDate(ds);
      window.scrollTo(0,0);
      return;
    }
    if(a==='gowrite'){ switchTab('write'); return; }
    if(a==='viewphoto'){
      var pids=String(act.getAttribute('data-pids')||'').split(',').filter(Boolean);
      openLightbox(pids, parseInt(act.getAttribute('data-idx'),10)||0);
      return;
    }
    if(a==='copyall'){ copyText(buildViewText(viewModel())); }
    else if(a==='printview'){ doPrintView(); }
  });

  /* 라이트박스 */
  $('lbClose').addEventListener('click', closeLightbox);
  $('lbPrev').addEventListener('click', function(){ lbStep(-1); });
  $('lbNext').addEventListener('click', function(){ lbStep(1); });
  $('lightbox').addEventListener('click', function(e){
    if(e.target===$('lightbox')) closeLightbox();
  });

  /* 백업 파일 */
  $('importInput').addEventListener('change', function(e){
    var f=e.target.files && e.target.files[0];
    e.target.value='';
    importBackupFile(f);
  });

  /* 키보드 */
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      if(!$('lightbox').hidden){ closeLightbox(); return; }
      if(sheetEl){ closeSheet(); return; }
    }
    if(!$('lightbox').hidden){
      if(e.key==='ArrowLeft') lbStep(-1);
      if(e.key==='ArrowRight') lbStep(1);
    }
  });

  /* 인쇄( PDF 저장) 가 끝나면 화면을 되돌린다 */
  window.addEventListener('afterprint', endPrint);
  if(window.matchMedia){
    try{
      var printMq=window.matchMedia('print');
      var mqChange=function(){ if(!printMq.matches) endPrint(); };
      if(printMq.addEventListener) printMq.addEventListener('change', mqChange);
      else if(printMq.addListener) printMq.addListener(mqChange);
    }catch(e){}
  }

  /* 페이지 이탈 시 저장 */
  window.addEventListener('beforeunload', function(){
    try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); }catch(e){}
  });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='hidden'){ saveNow(); }
  });
}

/* ────────────────────────────── sticky top ────────────────────────────── */
function syncStickyTop(){
  var head=document.querySelector('.topbar'), bar=document.querySelector('.datebar');
  if(head && bar && head.offsetHeight){
    bar.style.top=(head.offsetHeight-2)+'px';
  }
}

/* ────────────────────────────── boot ────────────────────────────── */
async function boot(){
  await loadState();
  var td=parseYmd(todayStr());
  viewY=td.getFullYear(); viewM=td.getMonth();
  selected=todayStr();
  loadView();
  loadEditor(selected);
  bindEvents();
  renderHeader();
  renderCalendar();
  renderSections();
  updateTodayAnalysis();
  updateDraftBadge();
  renderCatChips();
  syncRangeUI();
  applyTip();
  if(!storageUsable()){
    var tb=$('tipBanner');
    tb.hidden=false;
    tb.querySelector('.tx').innerHTML='⚠️ <b>이 브라우저에서는 기록 저장이 막혀 있어요.</b> Chrome 앱에서 열어 주시고, 기록한 뒤에는 ⚙️ 설정에서 꼭 백업해 주세요.';
    var tx=tb.querySelector('#tipClose'); if(tx) tx.style.display='none';
  }
  syncStickyTop();
  window.addEventListener('resize', syncStickyTop);
  window.addEventListener('orientationchange', function(){ setTimeout(syncStickyTop, 250); });
  if(!idb) console.info('IndexedDB unavailable — using localStorage');
}
boot();
})();
</script>
</body>
</html>
